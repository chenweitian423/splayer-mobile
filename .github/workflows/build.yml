name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.32.0

jobs:
  analyze:
    name: 静态检查 / 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # 桥接层契约：把真实 capy_runtime.js 装进 Node 沙箱，验证组件实际收到的参数。
      # 这一关挡的是「参数编码少一层 → 组件收到 null → 全线报 URL 非法」这类事故。
      - name: 桥接层契约测试
        run: node tools/runtime-contract-test.mjs

  android:
    name: Android APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: 写入签名（有 secrets 才启用；否则回落 debug 签名）
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "已使用仓库 secrets 中的正式签名"
          else
            echo "未配置 ANDROID_KEYSTORE_BASE64，使用 debug 签名（依然可安装）"
          fi

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 重命名产物
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/SPlayerMobile-${GITHUB_REF_NAME//\//_}-android.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS 未签名 IPA
    needs: analyze
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: 构建 iOS（不签名）
        run: flutter build ios --release --no-codesign

      - name: 打包为未签名 IPA
        run: |
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/SPlayerMobile-${GITHUB_REF_NAME//\//_}-ios-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa
          if-no-files-found: error

  release:
    name: 发布到 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 需要完整历史与 tag，才能算出「上一个版本」做对比链接。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 发布说明取自 CHANGELOG.md 里 `## vX.Y.Z` 那一段；找不到就提示补写。
      - name: 生成本次发布说明
        run: |
          set -uo pipefail
          tag="${GITHUB_REF_NAME}"

          # 1) 取 CHANGELOG.md 里 `## vX.Y.Z` 那一段
          awk -v t="$tag" '$0 ~ ("^## " t "($|[ ])") { flag=1; next } substr($0,1,3)=="## " { flag=0 } flag { print }' \
            CHANGELOG.md > release-notes.raw || true

          # 2) 裁掉段尾的空行与分隔线（段落末尾常带一个 `---`）
          awk '{ lines[NR] = $0 } END { n = NR; while (n > 0 && (lines[n] ~ /^[[:space:]]*$/ || lines[n] ~ /^-+[[:space:]]*$/)) n--; for (i = 1; i <= n; i++) print lines[i] }' \
            release-notes.raw > release-notes.md || true

          if [ ! -s release-notes.md ]; then
            echo "> ⚠️ 本版未在 \`CHANGELOG.md\` 写说明，请补充后重新发版。" > release-notes.md
          fi

          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          {
            echo
            echo "---"
            if [ -n "$prev" ]; then
              echo "**完整变更对比**：https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
            fi
            echo
            echo "**安装包**见下方 Assets：Android 用 \`*-android.apk\`；iOS 用 \`*-ios-unsigned.ipa\`（需自签）。"
            echo
            echo "> Android 安装包已用固定正式签名，可直接覆盖安装升级。"
          } >> release-notes.md

          echo "----- 将写入的发布说明 -----"
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-notes.md
